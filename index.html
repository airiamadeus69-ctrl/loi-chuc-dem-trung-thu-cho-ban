<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Nàng Đêm Trung Thu ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #120320, #2c0b38, #0f021a);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Nút điều khiển nhạc */
        .music-control {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s, background 0.3s;
        }

            .music-control:hover {
                transform: scale(1.1);
                background: rgba(240, 98, 146, 0.4);
            }

            .music-control.playing {
                animation: spin 4s linear infinite;
            }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Mặt trăng rằm phát sáng */
        .moon {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 120px;
            height: 120px;
            background-color: #fffde7;
            border-radius: 50%;
            box-shadow: 0 0 35px #fffde7, 0 0 80px #f8bbd0;
            pointer-events: none;
        }

        /* Cụm Đèn Lồng */
        .lantern-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none; /* Giúp chuột bấm xuyên qua nền */
            z-index: 1;
        }

        .lantern {
            width: 65px;
            height: 85px;
            border-radius: 20px;
            position: relative;
            animation: swing 3.5s infinite ease-in-out alternate;
            transform-origin: top center;
        }

            .lantern.pink {
                background: #f06292;
                box-shadow: 0 0 25px #f06292;
            }

            .lantern.purple {
                background: #ba68c8;
                box-shadow: 0 0 25px #ba68c8;
            }

        .lantern-text {
            line-height: 85px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.6);
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            width: 4px;
            height: 15px;
            background: #f48fb1;
            transform: translateX(-50%);
        }

        @keyframes swing {
            0% {
                transform: rotate(-7deg);
            }

            100% {
                transform: rotate(7deg);
            }
        }

        /* Thiệp chúc trung tâm */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        .avatar-container {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.9rem;
            color: #f8bbd0;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(248, 187, 208, 0.7);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #e1bee7;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Nút nhận quà */
        #openWishBtn {
            background: linear-gradient(45deg, #ec407a, #ab47bc);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
            position: relative;
            z-index: 20;
            pointer-events: auto !important;
        }

            #openWishBtn:hover {
                transform: translateY(-3px) scale(1.03);
                box-shadow: 0 8px 25px rgba(236, 64, 122, 0.7);
            }

        /* Modal Hộp Lời Chúc */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2a1138;
            border: 1px solid #f06292;
            padding: 30px 25px;
            border-radius: 20px;
            max-width: 85%;
            width: 380px;
            position: relative;
            color: #fff;
            box-shadow: 0 0 30px rgba(240, 98, 146, 0.6);
            text-align: center;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 26px;
            cursor: pointer;
            color: #f8bbd0;
            transition: color 0.2s;
        }

            .close-btn:hover {
                color: #ff4081;
            }

        /* Hiệu ứng trái tim rơi */
        .heart {
            position: absolute;
            color: #ff80ab;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Mặt trăng -->
    <div class="moon"></div>

    <!-- Đèn Lồng -->
    <div class="lantern-container">
        <div class="lantern pink">
            <div class="lantern-text">Yêu</div>
        </div>
        <div class="lantern purple">
            <div class="lantern-text">Thương</div>
        </div>
        <div class="lantern pink">
            <div class="lantern-text">An</div>
        </div>
    </div>

    <!-- Nút Nhạc Nền -->
    <div class="music-control" id="musicBtn">
        <span id="musicIcon">🎵</span>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Khung Nội Dung Chính -->
    <div class="card">
        <div class="avatar-container">🐰🌕</div>
        <h1>Happy Mid-Autumn!</h1>
        <p class="subtitle">Gửi đến cô gái đáng yêu nhất mùa Trung Thu này ✨</p>

        <button id="openWishBtn">Bấm vào đây để nhận quà 🎁</button>
    </div>

    <!-- Modal Hiển Thị Lời Chúc -->
    <div id="wishModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <p id="wishMessage"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Danh sách lời chúc dành riêng cho nàng
            const sweetWishes = [
                "Trung Thu này, chúc cậu luôn rạng rỡ như ánh trăng đêm Rằm, ngọt ngào như chiếc bánh dẻo và luôn bình an trong từng khoảnh khắc! 💖",
                "Trăng đêm nay rất đẹp, nhưng trong mắt tớ, cậu còn đáng yêu hơn cả ánh trăng nữa. Chúc cậu mùa Trung Thu tràn ngập niềm vui! ✨",
                "Mong rằng mọi điều ước nguyện ngọt ngào nhất của cậu trong đêm nay đều trở thành hiện thực. Đêm Rằm vui vẻ nhé, cô gái! 🌸",
                "Cảm ơn cậu vì đã xuất hiện và làm thế giới này trở nên dịu dàng hơn. Chúc cậu một mùa đoàn viên thật ấm áp! 🌙",
                "Chúc cậu ăn thật nhiều bánh Trung Thu mà vẫn giữ được vóc dáng xinh xắn, luôn mỉm cười rạng rỡ mỗi ngày nhé! 🎉"
            ];

            const openWishBtn = document.getElementById('openWishBtn');
            const wishModal = document.getElementById('wishModal');
            const closeBtn = document.getElementById('closeBtn');
            const wishMessage = document.getElementById('wishMessage');

            // Bắt sự kiện bấm nút mở lời chúc
            if (openWishBtn) {
                openWishBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const randomIndex = Math.floor(Math.random() * sweetWishes.length);
                    wishMessage.textContent = sweetWishes[randomIndex];
                    wishModal.style.display = 'flex';
                    createHeartBurst();
                });
            }

            // Đóng hộp thoại
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    wishModal.style.display = 'none';
                });
            }

            window.addEventListener('click', (e) => {
                if (e.target === wishModal) {
                    wishModal.style.display = 'none';
                }
            });

            // Quản lý phát nhạc nền
            const bgMusic = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            const musicIcon = document.getElementById('musicIcon');
            let isPlaying = false;

            function toggleMusic() {
                if (isPlaying) {
                    bgMusic.pause();
                    musicBtn.classList.remove('playing');
                    musicIcon.textContent = '🔇';
                    isPlaying = false;
                } else {
                    bgMusic.play().then(() => {
                        musicBtn.classList.add('playing');
                        musicIcon.textContent = '🎵';
                        isPlaying = true;
                    }).catch(err => {
                        console.log("Cần tương tác để phát nhạc:", err);
                    });
                }
            }

            musicBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMusic();
            });

            // Tự động bật nhạc khi cô ấy chạm/click lần đầu lên trang web
            function startMusicOnFirstTouch() {
                if (!isPlaying) {
                    bgMusic.play().then(() => {
                        isPlaying = true;
                        musicBtn.classList.add('playing');
                        musicIcon.textContent = '🎵';
                    }).catch(() => {});
                }
                window.removeEventListener('click', startMusicOnFirstTouch);
            }
            window.addEventListener('click', startMusicOnFirstTouch);

            // Hiệu ứng Trái Tim / Ngôi Sao Rơi
            function createFloatingHearts() {
                setInterval(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = Math.random() > 0.5 ? '💖' : '✨';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '-20px';
                    heart.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
                    heart.style.fontSize = (Math.random() * 10 + 12) + 'px';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 5500);
                }, 350);
            }

            // Hiệu ứng pháo hoa trái tim khi bấm nhận quà
            function createHeartBurst() {
                for (let i = 0; i < 16; i++) {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '💖';
                    heart.style.left = (window.innerWidth / 2 + (Math.random() * 220 - 110)) + 'px';
                    heart.style.top = (window.innerHeight / 2 + (Math.random() * 100 - 50)) + 'px';
                    heart.style.animationDuration = '2s';
                    heart.style.fontSize = '20px';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 2000);
                }
            }

            createFloatingHearts();
        });
    </script>
</body>
</html>
